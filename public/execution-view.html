<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Execution Trace</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8f8; color: #102a2e; }
    .shell { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
    header { grid-column: 1 / -1; padding: 14px 18px; background: #00262b; color: white; display: flex; gap: 12px; align-items: center; }
    header input { min-width: 340px; padding: 9px 11px; border-radius: 10px; border: 1px solid #d7e2e3; }
    header button { padding: 9px 13px; border: 0; border-radius: 10px; background: #abffae; color: #00262b; font-weight: 700; cursor: pointer; }
    #network { height: calc(100vh - 62px); background: white; border-right: 1px solid #dce6e7; }
    aside { padding: 16px; overflow: auto; }
    .card { background: white; border: 1px solid #dce6e7; border-radius: 14px; padding: 14px; box-shadow: 0 8px 26px rgba(0,0,0,.04); }
    .muted { color: #667b80; font-size: 13px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f2f6f6; border-radius: 10px; padding: 10px; max-height: 240px; overflow: auto; }
    h1 { font-size: 17px; margin: 0 10px 0 0; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px; font-size: 13px; margin: 8px 0 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>AI Execution Trace</h1>
      <input id="executionId" placeholder="Nhập execution_id hoặc dùng ?id=..." />
      <button id="loadBtn">Load trace</button>
      <span id="status" class="muted"></span>
    </header>
    <main id="network"></main>
    <aside>
      <div class="card" id="details">
        <h2>Chi tiết node</h2>
        <p class="muted">Click vào một node trên sơ đồ để xem input/output/model/thời gian xử lý.</p>
      </div>
    </aside>
  </div>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="/execution-view.js"></script>
</body>
</html>
